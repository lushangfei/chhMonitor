<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 360px;
        margin: 0;
        font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #fff;
        color: #222;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1e1e; color: #ddd; }
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(128,128,128,0.25);
      }
      header .title { font-weight: 600; font-size: 14px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.75; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
      .dot.ok { background: #2ecc71; }
      .dot.bad { background: #e74c3c; }
      .banner {
        margin: 8px 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #fdecea;
        color: #b71c1c;
        font-size: 12px;
        display: none;
      }
      .banner a { color: #b71c1c; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        .banner { background: #3a2020; color: #ff8a80; }
        .banner a { color: #ff8a80; }
      }
      ul { list-style: none; margin: 0; padding: 0; max-height: 400px; overflow-y: auto; }
      li {
        padding: 8px 12px;
        border-bottom: 1px solid rgba(128,128,128,0.12);
        cursor: pointer;
      }
      li:hover { background: rgba(128,128,128,0.1); }
      li .t { display: block; word-break: break-all; }
      li.new .t { font-weight: 600; }
      li .t .newdot {
        display: inline-block; width: 7px; height: 7px; border-radius: 50%;
        background: #c8102e; margin-right: 6px; vertical-align: middle;
      }
      li .by { font-size: 11px; opacity: 0.6; margin-top: 2px; }
      li.match { background: rgba(200,16,46,0.06); }
      .kwtag {
        display: inline-block; font-size: 10px; line-height: 1.4;
        color: #c8102e; border: 1px solid #c8102e; border-radius: 3px;
        padding: 0 4px; margin-right: 6px; vertical-align: middle;
      }
      .source-tag {
        display: inline-block; font-size: 10px; line-height: 1.4;
        color: #52606d; border: 1px solid #8795a1; border-radius: 3px;
        padding: 0 4px; margin-right: 6px; vertical-align: middle;
      }
      .empty { padding: 24px 12px; text-align: center; opacity: 0.6; }
      footer {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 12px; border-top: 1px solid rgba(128,128,128,0.25);
        font-size: 12px;
      }
      button {
        font: inherit; padding: 4px 10px; border: 1px solid rgba(128,128,128,0.4);
        background: transparent; color: inherit; border-radius: 5px; cursor: pointer;
      }
      button:hover { background: rgba(128,128,128,0.15); }
      .link { color: #3b82f6; cursor: pointer; }
      .meta { opacity: 0.55; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <span class="title">新帖监控</span>
      <span class="status"><span id="dot" class="dot"></span><span id="statusText">检查中…</span></span>
    </header>
    <div id="banner" class="banner">检测到未登录或登录已过期，<a id="loginLink" href="#">点此登录 Chiphell →</a></div>
    <div id="sourceBanner" class="banner" style="display:none"></div>
    <div id="notifyBanner" class="banner" style="display:none"></div>
    <ul id="list"></ul>
    <div id="empty" class="empty" style="display:none">暂无帖子</div>
    <footer>
      <button id="refresh">立即刷新</button>
      <span class="meta" id="meta"></span>
      <span class="link" id="coffee" title="请我喝咖啡 ☕">☕</span>
      <span class="link" id="opt">设置</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
